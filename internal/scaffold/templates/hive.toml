# [project]
# name = "my-project"       # Auto-detected from directory name

# [vars]
# Custom variables that can reference built-in vars (Project, ProjectRoot, etc.)
# and be used elsewhere in this file as {{ .Vars.key }}
# git_dir = "{{ .ProjectRoot }}/.git"

[worktree]
# root = "../{{ .Project }}.worktrees"

# ── Backend: choose ONE of [container] or [devcontainer] ──

# Option A: Raw Docker (default)
[container]
image = "node:22-slim"
workdir = "/workspace"
command = ["sleep", "infinity"]
# Additional volumes (worktree and .git are mounted automatically):
# volumes = ["entrypoint.sh:/usr/local/bin/entrypoint.sh"]
# ports = ["8080:8080", "3000:3000"]

[container.env]
# Env values are shell-evaluated, so subshells and $VAR references work:
# GH_TOKEN = "$(gh auth token)"
# AWS_PROFILE = "$AWS_PROFILE"
#
# These are always injected automatically:
#   HIVE_WORKER_ID, HIVE_PROJECT, HIVE_PROJECT_ROOT

# [container.build]
# dockerfile = "Dockerfile"
# context = "."

# Option B: Devcontainer (requires `devcontainer` CLI)
# Delegates to devcontainer.json for image, env, ports, features, lifecycle hooks.
# Hive auto-mounts .git and injects HIVE_* env vars.
# [devcontainer]
# config = ".devcontainer/devcontainer.json"  # optional, auto-detected from worktree

[hooks]
# async = true  # default: hooks run in background, output to .hive/*.log
# post_spawn = ["./scripts/post-spawn.sh {{ .WorkerID }}"]
# pre_kill = ["./scripts/pre-kill.sh {{ .WorkerID }}"]

[terminal]
provider = "none"        # "zellij" | "tmux" | "none"
# layout = "worker-tab.kdl"
# session = "{{ .Project }}"
